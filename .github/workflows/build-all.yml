name: Build all native apps

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run platform tests before publishing a successful build
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop / Windows
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Build Windows distribution
        shell: pwsh
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          $buildArgs = @('build.py', '--targets', 'desktop')
          if ($env:RUN_TESTS -eq 'true') { $buildArgs += '--with-tests' }
          python @buildArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Windows package and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-scanner-desktop-windows
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android / APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK build inputs
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Build debug APK
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          build_args=(build.py --targets android)
          if [ "$RUN_TESTS" = true ]; then build_args+=(--with-tests); fi
          python "${build_args[@]}"
      - name: Upload APK and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-scanner-android-debug
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS / Simulator app
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Ensure XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Build unsigned simulator app
        env:
          RUN_TESTS: ${{ inputs.run_tests }}
        run: |
          build_args=(build.py --targets ios)
          if [ "$RUN_TESTS" = true ]; then build_args+=(--with-tests); fi
          python "${build_args[@]}"
      - name: Upload simulator app and build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-scanner-ios-simulator
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  bundle:
    name: Complete three-platform bundle
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Collect successful native builds
        uses: actions/download-artifact@v4
        with:
          pattern: ai-car-scanner-*
          path: combined/
          merge-multiple: true
      - name: Publish one downloadable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ai-car-scanner-complete-build
          path: combined/
          if-no-files-found: error
          retention-days: 14
