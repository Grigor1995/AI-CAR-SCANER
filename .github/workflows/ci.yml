name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "finalbuild/**"
      - "pytest.ini"
      - "build.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.txt
      - name: Check Python unused imports, bindings and undefined names
        run: python -m ruff check . --select F401,F811,F821,F841
      - run: pytest -q
      - run: pytest -q -s tests/harness/test_performance.py
      - run: pytest -q --cov=backend --cov-report=term-missing --cov-report=xml
      - run: >-
          pytest -q
          --cov=backend/diagnostic
          --cov=backend/telemetry
          --cov=backend/multi_ecu
          --cov=backend/simulator
          --cov=global_data
          --cov=backend/ai/reasoning
          --cov=backend/ai/ml
          --cov=ai.live_analysis
          --cov-report=term-missing
          --cov-fail-under=90
      - run: python -m compileall backend
      - run: python backend/tools/import_check.py

  desktop:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        working-directory: finalbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Qt runtime libraries for headless UI tests
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: pip install -r apps/desktop/requirements-dev.txt
      - run: python -m py_compile apps/desktop/ui.py
      - run: python -m py_compile apps/desktop/main.py
      - name: Verify Desktop source syntax (real pytest smoke test)
        run: python -m pytest -q apps/desktop/test_smoke.py
      - name: Run Qt widget tests
        run: pytest -q apps/desktop/tests/test_ui_widgets.py
      - name: Run desktop unit tests with coverage
        run: >-
          pytest -q apps/desktop/tests --ignore=apps/desktop/tests/test_ui_widgets.py
          --cov=apps.desktop.api_client
          --cov=apps.desktop.models
          --cov=apps.desktop.storage
          --cov-report=term-missing
          --cov-report=xml:desktop-coverage.xml
          --cov-fail-under=95
      - name: Generate desktop logic coverage report
        if: always()
        continue-on-error: true
        run: >-
          pytest -q apps/desktop/tests --ignore=apps/desktop/tests/test_ui_widgets.py
          --cov=apps.desktop.api_client
          --cov=apps.desktop.models
          --cov=apps.desktop.storage
          --cov=apps.desktop.main
          --cov=apps.desktop.backend_worker
          --cov-report=term-missing
          --cov-report=xml:desktop-logic-coverage.xml
      - name: Upload desktop coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage-reports
          path: |
            finalbuild/desktop-coverage.xml
            finalbuild/desktop-logic-coverage.xml
          if-no-files-found: ignore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalbuild/apps/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport assembleDebug
      - name: Upload Android unit-test coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-coverage
          path: finalbuild/apps/mobile-android/app/build/reports/coverage/test/debug/
          if-no-files-found: ignore
