name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest -q
      - run: pytest -q -s tests/harness/test_performance.py
      - run: pytest -q --cov=backend --cov-report=term-missing --cov-report=xml
      - run: >-
          pytest -q
          --cov=backend/diagnostic
          --cov=backend/telemetry
          --cov=backend/multi_ecu
          --cov=backend/simulator
          --cov=backend/global_data.py
          --cov=backend/ai/reasoning
          --cov=backend/ai/ml
          --cov=backend/ai/live_analysis
          --cov-report=term-missing
          --cov-fail-under=90
      - run: python -m compileall backend
      - run: python backend/tools/import_check.py

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalbuild
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r apps/desktop/requirements.txt
      - run: python -m py_compile apps/desktop/ui.py
      - run: python -m py_compile apps/desktop/main.py

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: finalbuild/apps/mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
