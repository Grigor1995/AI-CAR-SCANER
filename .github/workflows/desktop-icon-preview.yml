name: Windows Desktop Icon Preview

# Manual-only to avoid unexpected Windows runner usage/cost.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Build full Desktop package and verify icons
        shell: pwsh
        run: ./finalbuild/scripts/build_windows_icon_preview.ps1

      - name: Upload complete Desktop preview and validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AICarScanner-Windows-x64-Icon-Preview
          path: |
            finalbuild/dist-release/AICarScanner-icon-preview.zip
            finalbuild/dist-release/icon-preview/desktop-icon-report.json
            finalbuild/dist-release/icon-preview/README_ICON_PREVIEW.txt
            finalbuild/dist-release/icon-preview/icons/
          if-no-files-found: warn
          retention-days: 14
