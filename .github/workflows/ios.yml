name: Native iOS Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "finalbuild/apps/mobile-ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "finalbuild/apps/mobile-ios/**"
      - ".github/workflows/ios.yml"

jobs:
  ios-tests:
    runs-on: macos-15
    defaults:
      run:
        working-directory: finalbuild/apps/mobile-ios
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodegen version

      - name: Build and run unit tests
        run: |
          xcodebuild test             -project AICarScanner.xcodeproj             -scheme AICarScanner             -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'             CODE_SIGNING_ALLOWED=NO             -enableCodeCoverage YES             -resultBundlePath TestResults.xcresult

      - name: Generate iOS code coverage report
        if: success()
        run: |
          xcrun xccov view --report TestResults.xcresult | tee coverage-report.txt
          xcrun xccov view --report --json TestResults.xcresult > coverage-report.json

      - name: Upload XCTest and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-and-coverage-reports
          path: |
            finalbuild/apps/mobile-ios/TestResults.xcresult
            finalbuild/apps/mobile-ios/coverage-report.txt
            finalbuild/apps/mobile-ios/coverage-report.json
          if-no-files-found: ignore
