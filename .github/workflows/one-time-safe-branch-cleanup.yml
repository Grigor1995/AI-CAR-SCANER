name: One-time safe merged branch cleanup
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-only-merged-branches:
    if: contains(github.event.head_commit.message, '[cleanup-merged-branches]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify full ancestry before each deletion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          branches=(
            'docs/mobile-ui-demo-screenshots-20261026'
            'integrate/branch-audit-cleanup-20261026'
            'feature/backend-unified-vehicle-obd-audit-20261022'
            'feature/neon-ui-desktop-android-ios'
            'fix/desktop-v1-fastapi-recovery-20261021'
            'fix/mobile-desktop-catalog-parity-20261022'
          )
          for branch in "${branches[@]}"; do
            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "SKIP (missing): $branch"
              continue
            fi
            if ! git merge-base --is-ancestor "refs/remotes/origin/$branch" "refs/remotes/origin/main"; then
              echo "KEEP (not fully merged): $branch"
              continue
            fi
            echo "PRUNE fully merged: $branch"
            if git push origin --delete "$branch"; then
              echo "Deleted: $branch"
            else
              echo "Permission or race prevented deleting: $branch"
            fi
          done
          echo 'KEEP: main; design/neon-3d-ui-review-20261023; feat/backend-obd-vehicle-registry-20261022'
