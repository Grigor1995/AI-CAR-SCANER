name: AICarScanner
options:
  bundleIdPrefix: com.aicarscaner
  deploymentTarget:
    iOS: "17.0"
targets:
  AICarScanner:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AICarScanner
        excludes:
          - VehicleModels/**
      - path: AICarScanner/VehicleModels
        type: folder
        buildPhase: resources
      - path: AICarScanner/VehicleCatalog
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicarscaner.ios
        INFOPLIST_FILE: AICarScanner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - AICarScannerTests
  AICarScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: AICarScanner
