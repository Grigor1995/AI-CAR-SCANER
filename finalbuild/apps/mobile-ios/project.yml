name: AICarScanner
options:
  bundleIdPrefix: com.aicarscaner
  deploymentTarget:
    iOS: '17.0'
targets:
  AICarScannerUser:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: AICarScanner
      excludes:
      - VehicleModels/**
      - VehicleCatalog/**
      - Launcher/**
    - path: AICarScanner/VehicleModels
      type: folder
      buildPhase: resources
    - path: AICarScanner/VehicleCatalog
      type: folder
      buildPhase: resources
    - path: AICarScanner/Launcher
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicarscaner.user
        INFOPLIST_FILE: AICarScanner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconUser
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGN_STYLE: Automatic
        PRODUCT_MODULE_NAME: AICarScanner
        AI_CAR_WORKSPACE: USER
        AI_CAR_DISPLAY_NAME: AI Car User
        AI_CAR_BACKEND_URL: http://127.0.0.1:8001
    scheme:
      testTargets:
      - AICarScannerTests
  AICarScannerCustomer:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: AICarScanner
      excludes:
      - VehicleModels/**
      - VehicleCatalog/**
      - Launcher/**
    - path: AICarScanner/VehicleModels
      type: folder
      buildPhase: resources
    - path: AICarScanner/VehicleCatalog
      type: folder
      buildPhase: resources
    - path: AICarScanner/Launcher
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicarscaner.customer
        INFOPLIST_FILE: AICarScanner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconCustomer
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGN_STYLE: Automatic
        PRODUCT_MODULE_NAME: AICarScanner
        AI_CAR_WORKSPACE: CUSTOMER
        AI_CAR_DISPLAY_NAME: AI Car Customer
        AI_CAR_BACKEND_URL: http://127.0.0.1:8001
  AICarScannerMarket:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: AICarScanner
      excludes:
      - VehicleModels/**
      - VehicleCatalog/**
      - Launcher/**
    - path: AICarScanner/VehicleModels
      type: folder
      buildPhase: resources
    - path: AICarScanner/VehicleCatalog
      type: folder
      buildPhase: resources
    - path: AICarScanner/Launcher
      type: folder
      buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aicarscaner.market
        INFOPLIST_FILE: AICarScanner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMarket
        SWIFT_VERSION: 5.9
        TARGETED_DEVICE_FAMILY: 1,2
        CODE_SIGN_STYLE: Automatic
        PRODUCT_MODULE_NAME: AICarScanner
        AI_CAR_WORKSPACE: MARKET
        AI_CAR_DISPLAY_NAME: AI Car Market
        AI_CAR_BACKEND_URL: http://127.0.0.1:8001
  AICarScannerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '17.0'
    sources:
    - path: Tests
    dependencies:
    - target: AICarScannerUser
