services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: diagnostic, POSTGRES_USER: diagnostic, POSTGRES_PASSWORD: diagnostic}
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
  api:
    build: {context: ., dockerfile: infrastructure/docker/backend.Dockerfile}
    environment: {DATABASE_URL: postgresql+psycopg://diagnostic:diagnostic@postgres:5432/diagnostic}
    ports: ['8000:8000']
    depends_on: [postgres]
volumes: {postgres_data: {}}
